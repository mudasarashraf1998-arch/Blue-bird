name: Mads Bus APK

on:
  push:
    branches: ["**"]
    paths:
      - .github/workflows/mads-bus-apk.yml
      - Mads_experiments/mads-bus/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mads-bus-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test, build, and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mads_experiments/mads-bus/package-lock.json

      - name: Install locked web and Android dependencies
        working-directory: Mads_experiments/mads-bus
        run: npm ci --no-audit --no-fund

      - name: Run physics and wallet regression tests
        working-directory: Mads_experiments/mads-bus
        run: npm test

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager --licenses >/dev/null < <(yes)
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build web bundle and sync Capacitor Android
        working-directory: Mads_experiments/mads-bus
        run: npm run android:sync

      - name: Build, sign, and verify debug APK
        working-directory: Mads_experiments/mads-bus
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java 21 is required on the runner}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          java -version
          chmod +x android/gradlew
          (cd android && ./gradlew assembleDebug --stacktrace --no-daemon)
          mkdir -p artifacts
          apk="artifacts/MadsBus-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee artifacts/signature.txt
          sha256sum "$apk" | tee artifacts/MadsBus-debug.apk.sha256

      - name: Upload installable APK and verification details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MadsBus-debug
          path: |
            Mads_experiments/mads-bus/artifacts/MadsBus-debug.apk
            Mads_experiments/mads-bus/artifacts/MadsBus-debug.apk.sha256
            Mads_experiments/mads-bus/artifacts/signature.txt
          if-no-files-found: error
          retention-days: 14
